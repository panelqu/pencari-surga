<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanelQu - Special Offer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .banner-container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 20px;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }
        .banner-container img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Link Monetag Anda -->
        <a href="https://omg10.com/4/9019136" target="_blank">
            <!-- Masukkan link ImgBB Anda di dalam tanda kutip src -->
            <img src="https://i.ibb.co.com/N69qRxkD/FB-IMG-1757169263453.jpg" alt="Klik Disini">
        </a>
    </div>

</body>
</html>
